name: Sync upstream

# Puxa o ByMykel/CSGO-API pro main deste repo, todo dia.
#
# Motor é git puro, não a API merge-upstream — mesmo o repo sendo fork e a API
# estando disponível. O motivo é que o nome source-catalog-cs2 foi escolhido pra
# não amarrar ao fornecedor: se um dia a fonte virar SteamDatabase/GameTracking,
# git puro muda uma URL e mais nada, enquanto merge-upstream deixa de existir —
# você não pode fazer merge-upstream de um repo do qual não é fork.
#
# O custo é clonar ~280 MB por execução em vez de uma chamada server-side. Num
# repo público os minutos de Actions são livres, então é wall-clock, não fatura.
#
# Merge automático, sem PR, de propósito: o diff é de dezenas de MB de JSON
# gerado, e revisar isso é teatro. O portão de verdade é o deploy, que é manual
# e mora no umbrella. Push ruim do upstream chega ao main e para ali.

on:
  schedule:
    # 06:00 UTC (03:00 BRT), diário. Os commits de bot do upstream concentram
    # em 22h–01h UTC, então isso pega a janela inteira do dia anterior.
    # Intervalo mediano entre updates deles é 1 dia — daí diário e não semanal.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # fetch-depth 0 é obrigatório: merge precisa das duas histórias inteiras.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar o upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ByMykel/CSGO-API.git
          git fetch --no-tags upstream main
          echo "atrás: $(git rev-list --count HEAD..upstream/main) commits"
          echo "à frente: $(git rev-list --count upstream/main..HEAD) commits (nossos workflows)"

      - name: Merge
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          behind=$(git rev-list --count HEAD..upstream/main)
          if [ "$behind" = "0" ]; then
            echo "já estava em dia" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Sem -X: conflito tem que falhar alto. O upstream não toca nos nossos
          # arquivos, então conflito aqui significa que alguma premissa mudou.
          if ! git merge --no-edit upstream/main; then
            echo "::error::conflito com o upstream — resolver à mão"
            git merge --abort
            exit 1
          fi

          git push origin main
          echo "### $behind commit(s) do upstream" >> "$GITHUB_STEP_SUMMARY"
          git log --oneline "HEAD@{1}..HEAD" --no-merges | head -30 >> "$GITHUB_STEP_SUMMARY"
