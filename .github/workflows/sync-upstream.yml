name: Sync upstream

# Pulls ByMykel/CSGO-API into this repo's main, every day.
#
# The engine is plain git, not the merge-upstream API — even though this repo is
# a fork and the API is available. The reason is that the name source-catalog-cs2
# was chosen so as not to tie us to the vendor: if the source ever becomes
# SteamDatabase/GameTracking, plain git changes one URL and nothing else, while
# merge-upstream stops existing — you cannot merge-upstream a repo you are not a
# fork of.
#
# The cost is cloning ~280 MB per run instead of one server-side call. On a
# public repo Actions minutes are free, so it is wall-clock, not billing.
#
# Automatic merge, no PR, on purpose: the diff is tens of MB of generated JSON,
# and reviewing that is theater. The real gate is the deploy, which is manual and
# lives in the umbrella. A bad push from upstream reaches main and stops there.

on:
  schedule:
    # 06:00 UTC (03:00 BRT), daily. Upstream's bot commits cluster between
    # 22:00 and 01:00 UTC, so this catches the whole previous-day window.
    # Their median interval between updates is 1 day — hence daily, not weekly.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # fetch-depth 0 is mandatory: a merge needs both histories in full.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ByMykel/CSGO-API.git
          git fetch --no-tags upstream main
          echo "behind: $(git rev-list --count HEAD..upstream/main) commits"
          echo "ahead: $(git rev-list --count upstream/main..HEAD) commits (our workflows)"

      - name: Merge
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          behind=$(git rev-list --count HEAD..upstream/main)
          if [ "$behind" = "0" ]; then
            echo "already up to date" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # No -X: a conflict has to fail loudly. Upstream does not touch our
          # files, so a conflict here means some premise changed.
          if ! git merge --no-edit upstream/main; then
            echo "::error::conflict with upstream — resolve by hand"
            git merge --abort
            exit 1
          fi

          git push origin main
          echo "### $behind commit(s) from upstream" >> "$GITHUB_STEP_SUMMARY"
          git log --oneline "HEAD@{1}..HEAD" --no-merges | head -30 >> "$GITHUB_STEP_SUMMARY"
