name: Sync upstream

# Puxa o ByMykel/CSGO-API pro main deste fork, todo dia.
#
# Merge automático, sem PR, de propósito: o diff é de dezenas de MB de JSON
# gerado, e revisar isso é teatro — ninguém lê. O portão de verdade é o deploy,
# que é manual (deploy-catalog.yml). Push ruim do upstream chega aqui mas não
# chega em produção enquanto você não mandar.
#
# O fork diverge do upstream pelos arquivos deste diretório, então o
# merge-upstream faz merge em vez de fast-forward. Sem conflito, porque o
# upstream nunca toca nestes arquivos — mas se um dia tocar, o job falha alto
# em vez de resolver sozinho.

on:
  schedule:
    - cron: "0 7 * * *"   # 04:00 BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: merge-upstream em main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if ! out=$(gh api -X POST "repos/$REPO/merge-upstream" -f branch=main 2>&1); then
            echo "::error::merge-upstream falhou — provavelmente conflito com o upstream"
            echo "$out"
            exit 1
          fi
          echo "$out"
          type=$(echo "$out" | jq -r '.merge_type // "unknown"')
          echo "merge_type=$type" >> "$GITHUB_STEP_SUMMARY"
          case "$type" in
            none)         echo "já estava em dia" ;;
            fast-forward) echo "::notice::fast-forward — o fork ainda não divergiu" ;;
            merge)        echo "::notice::merge — normal, o fork tem os workflows próprios" ;;
          esac

      - name: O que mudou
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/commits?sha=main&per_page=10" \
            --jq '.[] | "- \(.sha[0:7]) \(.commit.message | split("\n")[0])"' \
            >> "$GITHUB_STEP_SUMMARY" || true
