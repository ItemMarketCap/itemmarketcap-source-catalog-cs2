name: Deploy catálogo

# Manual, sempre. O sync é automático e o deploy não é — essa assimetria é o
# desenho, não um pendente: push ruim do upstream entra no main sozinho e para
# ali, até alguém decidir.
#
# `ref` é o que torna rollback possível. Sem ele só dá pra deployar "o que o
# main é agora", e voltar pra última versão boa fica impossível.
#
# Segredos: CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag ou branch a deployar (default: main). Para rollback, o SHA da última versão boa.'
        type: string
        default: main
        required: true
      env:
        description: 'Ambiente'
        type: choice
        options: [staging, prod]
        default: staging
        required: true

concurrency:
  group: deploy-catalog-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.env }} · ${{ inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # A Cloudflare recusa arquivo acima de 25 MiB, em Pages e em Workers
      # Static Assets, no free e no pago igual — o plano pago sobe a contagem
      # de arquivos, nunca o tamanho. Hoje `all.json` (~75 MB) e
      # `skins_not_grouped.json` (~35 MB) estouram; os dois são arquivos de
      # conveniência "tudo junto", e os específicos cobrem o mesmo conteúdo.
      #
      # O que cai é logado de propósito: corte silencioso lê como "subiu tudo".
      - name: Separar o que a Cloudflare aceita
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          cp -R public/api/. dist/
          LIMIT=$((25 * 1024 * 1024))
          dropped=0
          echo "### Arquivos acima de 25 MiB (não deployados)" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r f; do
            size=$(wc -c < "$f")
            if [ "$size" -gt "$LIMIT" ]; then
              printf -- '- `%s` — %s MB\n' "${f#dist/}" "$((size / 1048576))" >> "$GITHUB_STEP_SUMMARY"
              rm -f "$f"
              dropped=$((dropped + 1))
            fi
          done < <(find dist -type f)
          [ "$dropped" -eq 0 ] && echo "_nenhum_" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$dropped arquivo(s) acima do limite removidos do deploy"
          echo "total: $(find dist -type f | wc -l | tr -d ' ') arquivos, $(du -sh dist | cut -f1)"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name itemmarketcap-catalog-api-${{ inputs.env }}
